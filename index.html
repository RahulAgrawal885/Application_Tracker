<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker & Outreach</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg0:#0a0e1a;--bg1:#111827;--bg2:#1f2937;--bg3:#374151;
      --blue:#3b82f6;--green:#10b981;--yellow:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--teal:#14b8a6;
      --txt1:#f9fafb;--txt2:#9ca3af;--bdr:#374151;
    }
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg0);color:var(--txt1);min-height:100vh}
    /* ── HEADER ── */
    .header{background:var(--bg1);border-bottom:1px solid var(--bdr);padding:1rem 1.5rem;position:sticky;top:0;z-index:200}
    .header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
    .logo{font-size:1.25rem;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .tabs{display:flex;gap:.25rem}
    .tab{padding:.5rem 1.25rem;border:1px solid var(--bdr);background:transparent;color:var(--txt2);border-radius:6px;cursor:pointer;font-weight:600;font-size:.875rem;transition:all .2s}
    .tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .tab:not(.active):hover{background:var(--bg2);color:var(--txt1)}
    .stats-row{display:flex;gap:.75rem;flex-wrap:wrap}
    .stat{background:var(--bg2);border:1px solid var(--bdr);border-radius:8px;padding:.6rem 1rem;min-width:110px;flex:1;transition:transform .2s}
    .stat:hover{transform:translateY(-1px)}
    .stat-val{font-size:1.5rem;font-weight:700;color:var(--blue)}
    .stat-val.green{color:var(--green)}
    .stat-val.red{color:var(--red)}
    .stat-val.yellow{color:var(--yellow)}
    .stat-val.purple{color:var(--purple)}
    .stat-lbl{font-size:.7rem;color:var(--txt2);text-transform:uppercase;letter-spacing:.05em;margin-top:.1rem}
    /* ── TABS CONTENT ── */
    .tab-content{display:none;padding:1.25rem 1.5rem}
    .tab-content.active{display:block}
    /* ── CONTROLS ── */
    .controls{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
    .search-wrap{flex:1;min-width:220px;position:relative}
    .search-wrap input{width:100%;padding:.5rem .75rem .5rem 2.2rem;background:var(--bg2);border:1px solid var(--bdr);border-radius:6px;color:var(--txt1);font-size:.875rem}
    .search-wrap::before{content:"🔍";position:absolute;left:.6rem;top:50%;transform:translateY(-50%);opacity:.5;font-size:.9rem}
    select,input[type=date]{padding:.5rem .75rem;background:var(--bg2);border:1px solid var(--bdr);border-radius:6px;color:var(--txt1);font-size:.875rem;cursor:pointer}
    select:focus,input:focus{outline:none;border-color:var(--blue)}
    .btn{padding:.5rem 1rem;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:.875rem;display:inline-flex;align-items:center;gap:.4rem;transition:all .2s}
    .btn-primary{background:var(--blue);color:#fff}
    .btn-primary:hover{background:#2563eb;transform:translateY(-1px)}
    .btn-secondary{background:var(--bg2);color:var(--txt1);border:1px solid var(--bdr)}
    .btn-secondary:hover{background:var(--bg3)}
    .btn-sm{padding:.25rem .6rem;font-size:.75rem}
    .btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
    .btn-danger:hover{background:rgba(239,68,68,.3)}
    /* ── CHARTS ── */
    .chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem;margin-bottom:1.25rem}
    .chart-card{background:var(--bg1);border:1px solid var(--bdr);border-radius:10px;padding:1.25rem}
    .chart-card h3{font-size:.875rem;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1rem}
    .chart-card canvas{max-height:220px}
    /* ── TABLE ── */
    .table-wrap{background:var(--bg1);border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
    .table-header{padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bdr)}
    .table-title{font-size:.875rem;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.04em}
    .pagination{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--txt2)}
    .pg-btn{padding:.25rem .6rem;background:var(--bg2);border:1px solid var(--bdr);border-radius:4px;color:var(--txt1);cursor:pointer;font-size:.75rem}
    .pg-btn:hover{background:var(--bg3)}
    table{width:100%;border-collapse:collapse;font-size:.8rem}
    th{background:var(--bg2);padding:.65rem .9rem;text-align:left;font-weight:600;color:var(--txt2);border-bottom:2px solid var(--bdr);cursor:pointer;user-select:none;white-space:nowrap;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
    th:hover{color:var(--txt1)}
    td{padding:.65rem .9rem;border-bottom:1px solid rgba(55,65,81,.5);vertical-align:middle}
    tr:hover{background:rgba(59,130,246,.04)}
    tr:last-child td{border-bottom:none}
    .badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:99px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;cursor:pointer;transition:all .15s;border:none}
    .badge:hover{filter:brightness(1.3);transform:scale(1.04)}
    .s-Applied{background:rgba(59,130,246,.18);color:#60a5fa}
    .s-OA{background:rgba(139,92,246,.18);color:#a78bfa}
    .s-Phone{background:rgba(245,158,11,.18);color:#fbbf24}
    .s-Superday{background:rgba(236,72,153,.18);color:#f472b6}
    .s-Offer{background:rgba(16,185,129,.18);color:#34d399}
    .s-Accepted{background:rgba(5,150,105,.3);color:#6ee7b7}
    .s-Rejected{background:rgba(239,68,68,.18);color:#f87171}
    .s-Withdrawn{background:rgba(107,114,128,.18);color:#9ca3af}
    .esg{display:inline-flex;padding:.1rem .4rem;background:rgba(5,150,105,.2);color:#34d399;border-radius:4px;font-size:.6rem;font-weight:700;text-transform:uppercase;margin-left:.4rem}
    /* outreach badges */
    .r-Waiting{background:rgba(245,158,11,.18);color:#fbbf24}
    .r-Replied{background:rgba(16,185,129,.18);color:#34d399}
    .r-Positive{background:rgba(16,185,129,.25);color:#6ee7b7}
    .r-Negative{background:rgba(239,68,68,.18);color:#f87171}
    .r-NoReply{background:rgba(107,114,128,.18);color:#9ca3af}
    .p-LinkedIn{background:rgba(59,130,246,.18);color:#60a5fa}
    .p-Email{background:rgba(139,92,246,.18);color:#a78bfa}
    .p-Other{background:rgba(107,114,128,.18);color:#9ca3af}
    .overdue{color:var(--red);font-weight:700;animation:pulse 2s infinite}
    .followup-soon{color:var(--yellow);font-weight:600}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .link-btn{color:var(--blue);text-decoration:none;font-size:.75rem}
    .link-btn:hover{text-decoration:underline}
    /* ── MODAL ── */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center;padding:1rem}
    .overlay.open{display:flex}
    .modal{background:var(--bg1);border:1px solid var(--bdr);border-radius:12px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.6)}
    .modal-hdr{padding:1.25rem 1.5rem;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
    .modal-hdr h2{font-size:1.1rem;font-weight:700}
    .close-btn{background:none;border:none;color:var(--txt2);font-size:1.5rem;cursor:pointer;line-height:1;padding:.25rem}
    .close-btn:hover{color:var(--txt1)}
    .modal-body{padding:1.25rem 1.5rem}
    .modal-ftr{padding:1rem 1.5rem;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:.5rem}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    .form-group{margin-bottom:.9rem}
    .form-group label{display:block;margin-bottom:.35rem;font-size:.8rem;font-weight:500;color:var(--txt2)}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:.65rem .75rem;background:var(--bg2);border:1px solid var(--bdr);border-radius:6px;color:var(--txt1);font-size:.875rem}
    .form-group textarea{resize:vertical;min-height:70px}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--blue)}
    .check-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.9rem}
    .check-row input[type=checkbox]{width:auto;accent-color:var(--green)}
    .check-row label{font-size:.875rem;color:var(--txt2)}
    /* ── TOAST ── */
    .toast-wrap{position:fixed;bottom:1.5rem;right:1.5rem;z-index:2000;display:flex;flex-direction:column;gap:.4rem}
    .toast{background:var(--bg1);border:1px solid var(--bdr);padding:.75rem 1.25rem;border-radius:8px;display:flex;align-items:center;gap:.6rem;animation:slideIn .25s ease;min-width:260px;font-size:.875rem}
    .toast.ok{border-left:4px solid var(--green)}
    .toast.err{border-left:4px solid var(--red)}
    .toast.info{border-left:4px solid var(--blue)}
    @keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
    /* ── OUTREACH ALERTS ── */
    .alert-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:.75rem 1rem;margin-bottom:1rem;font-size:.8rem}
    .alert-box h4{color:var(--yellow);font-size:.8rem;margin-bottom:.35rem}
    .alert-item{display:flex;align-items:center;gap:.5rem;padding:.2rem 0;color:var(--txt2)}
    .alert-item strong{color:var(--txt1)}
    /* ── TEMPLATES ── */
    .tmpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem}
    .tmpl-card{background:var(--bg1);border:1px solid var(--bdr);border-radius:10px;padding:1.25rem;display:flex;flex-direction:column;gap:.75rem;transition:border-color .2s}
    .tmpl-card:hover{border-color:var(--blue)}
    .tmpl-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
    .tmpl-name{font-weight:700;font-size:.95rem;color:var(--txt1)}
    .tmpl-body{font-size:.8rem;color:var(--txt2);line-height:1.6;white-space:pre-wrap;background:var(--bg2);border-radius:6px;padding:.75rem;max-height:160px;overflow-y:auto;flex:1}
    .tmpl-footer{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
    .tmpl-meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
    .cat-pill{padding:.2rem .6rem;border-radius:99px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .cat-Connect{background:rgba(59,130,246,.2);color:#60a5fa}
    .cat-Followup{background:rgba(245,158,11,.2);color:#fbbf24}
    .cat-ColdEmail{background:rgba(139,92,246,.2);color:#a78bfa}
    .cat-Referral{background:rgba(16,185,129,.2);color:#34d399}
    .cat-ThankYou{background:rgba(20,184,166,.2);color:#2dd4bf}
    .char-count{font-size:.7rem;color:var(--txt2);font-variant-numeric:tabular-nums}
    .char-count.over{color:var(--red);font-weight:700}
    .rate-btn{padding:.2rem .6rem;border-radius:99px;font-size:.68rem;font-weight:700;border:1px solid transparent;cursor:pointer;transition:all .15s;background:transparent}
    .rate-btn.working{background:rgba(16,185,129,.15);color:#34d399;border-color:rgba(16,185,129,.4)}
    .rate-btn.low{background:rgba(239,68,68,.15);color:#f87171;border-color:rgba(239,68,68,.4)}
    .rate-btn.unrated{color:var(--txt2);border-color:var(--bdr)}
    .rate-btn:hover{filter:brightness(1.3)}
    .char-bar{height:3px;border-radius:2px;background:var(--bg3);margin-top:.35rem;overflow:hidden}
    .char-bar-fill{height:100%;border-radius:2px;transition:width .2s,background .2s}
    .tmpl-filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
    .cat-filter-btn{padding:.35rem .85rem;border-radius:99px;font-size:.75rem;font-weight:600;border:1px solid var(--bdr);background:transparent;color:var(--txt2);cursor:pointer;transition:all .15s}
    .cat-filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .cat-filter-btn:hover:not(.active){background:var(--bg2);color:var(--txt1)}
    .empty-tmpl{text-align:center;padding:3rem 1rem;color:var(--txt2);font-size:.875rem}
    /* ── SECTION DIVIDER ── */
    .section-title{font-size:.75rem;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
    .section-title::after{content:'';flex:1;height:1px;background:var(--bdr)}
    @media(max-width:700px){
      .header,.tab-content{padding:.75rem}
      .stats-row{gap:.5rem}
      .stat{min-width:80px}
      .form-row{grid-template-columns:1fr}
      .chart-row{grid-template-columns:1fr}
    }
    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:var(--bg0)}
    ::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

    /* ── SETUP & LOADING OVERLAYS ── */
    .full-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:3000;display:none;align-items:center;justify-content:center;padding:1.5rem}
    .setup-box{background:var(--bg1);border:1px solid var(--bdr);border-radius:14px;width:100%;max-width:580px;padding:2rem;box-shadow:0 30px 60px rgba(0,0,0,.5)}
    .setup-box h2{font-size:1.3rem;font-weight:700;margin-bottom:.4rem;background:linear-gradient(135deg,var(--blue),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .setup-box p{font-size:.875rem;color:var(--txt2);margin-bottom:1.25rem}
    .setup-steps{background:var(--bg2);border-radius:8px;padding:1rem 1.25rem;margin-bottom:1.25rem;font-size:.82rem;color:var(--txt2);line-height:1.9}
    .setup-steps strong{color:var(--txt1)}
    .setup-steps code{background:var(--bg3);padding:.1rem .4rem;border-radius:3px;font-family:monospace;color:var(--teal);font-size:.8rem}
    .setup-url-row{display:flex;gap:.5rem;margin-bottom:.75rem}
    .setup-url-row input{flex:1;padding:.65rem .85rem;background:var(--bg2);border:1px solid var(--bdr);border-radius:6px;color:var(--txt1);font-size:.875rem}
    .setup-url-row input:focus{outline:none;border-color:var(--blue)}
    #connectMsg{font-size:.8rem;min-height:1.2rem;margin-bottom:.5rem}
    .setup-offline{font-size:.75rem;color:var(--txt2);text-align:center;margin-top:.75rem;cursor:pointer;text-decoration:underline}
    .setup-offline:hover{color:var(--txt1)}
    .loading-box{display:flex;flex-direction:column;align-items:center;gap:1rem;color:var(--txt2)}
    .spinner{width:40px;height:40px;border:3px solid var(--bdr);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* ── SAVE STATUS ── */
    .save-status{font-size:.72rem;font-weight:600;padding:.2rem .6rem;border-radius:4px;transition:all .3s}
    .save-status.saving{color:var(--yellow)}
    .save-status.saved{color:var(--green)}
    .save-status.error{color:var(--red)}
    .save-status.offline{color:var(--txt2);background:var(--bg2);border:1px solid var(--bdr)}
    /* ── SETTINGS BUTTON ── */
    .settings-btn{background:none;border:1px solid var(--bdr);color:var(--txt2);border-radius:6px;padding:.35rem .6rem;cursor:pointer;font-size:.85rem;transition:all .2s}
    .settings-btn:hover{background:var(--bg2);color:var(--txt1)}
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">📊 Job Tracker & Outreach</div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <span id="saveStatus" class="save-status"></span>
      <button class="btn btn-secondary btn-sm" onclick="exportCSV()">⬇ Export</button>
      <button class="settings-btn" onclick="showSetup()" title="Google Sheets settings">⚙</button>
      <button class="btn btn-primary btn-sm" id="addBtn" onclick="openAddModal()">＋ Add</button>
    </div>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <div style="margin-top:.75rem;display:flex;gap:.25rem">
    <button class="tab active" id="tab-apps" onclick="switchTab('apps')">💼 Applications</button>
    <button class="tab" id="tab-outreach" onclick="switchTab('outreach')">📨 Outreach</button>
    <button class="tab" id="tab-templates" onclick="switchTab('templates')">✉️ Templates</button>
  </div>
</div>

<div class="tab-content active" id="content-apps">
  <div class="chart-row">
    <div class="chart-card"><h3>Status Breakdown</h3><canvas id="chartStatus"></canvas></div>
    <div class="chart-card"><h3>Applications Over Time</h3><canvas id="chartTimeline"></canvas></div>
  </div>
  <div class="controls">
    <div class="search-wrap"><input type="text" id="appSearch" placeholder="Search company, position..." oninput="renderAppsTable()"></div>
    <select id="appStatusFilter" onchange="renderAppsTable()">
      <option value="">All Statuses</option>
      <option>Applied</option><option>OA/HireVue</option><option>Phone Screen</option>
      <option>Superday/Final</option><option>Offer</option><option>Accepted</option>
      <option>Rejected</option><option>Withdrawn</option>
    </select>
    <select id="appLocFilter" onchange="renderAppsTable()"><option value="">All Locations</option></select>
    <select id="appSortBy" onchange="renderAppsTable()">
      <option value="dateApplied-desc">Newest First</option>
      <option value="dateApplied-asc">Oldest First</option>
      <option value="company-asc">Company A-Z</option>
      <option value="status-asc">Status</option>
    </select>
  </div>
  <div class="table-wrap">
    <div class="table-header">
      <span class="table-title" id="appTableTitle">Applications</span>
      <div class="pagination" id="appPagination"></div>
    </div>
    <div style="overflow-x:auto"><table><thead><tr>
      <th>Company</th><th>Position</th><th>Location</th><th>Applied</th><th>Status</th><th>Outreach</th><th>Actions</th>
    </tr></thead><tbody id="appsBody"></tbody></table></div>
  </div>
</div>

<div class="tab-content" id="content-outreach">
  <div id="followupAlerts"></div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:.5rem">
    <button class="btn btn-danger btn-sm" onclick="resetOutreach()" title="Wipe all outreach contacts and start fresh">🗑 Clear All Outreach</button>
  </div>
  <div class="controls">
    <div class="search-wrap"><input type="text" id="outSearch" placeholder="Search company, contact name..." oninput="renderOutreachTable()"></div>
    <select id="outTypeFilter" onchange="renderOutreachTable()">
      <option value="">All Types</option>
      <option value="role">Role-specific</option>
      <option value="networking">Networking (no role)</option>
    </select>
    <select id="outCompanyFilter" onchange="renderOutreachTable()"><option value="">All Companies</option></select>
    <select id="outReplyFilter" onchange="renderOutreachTable()">
      <option value="">All Reply Status</option>
      <option>Waiting</option><option>Replied – Positive</option>
      <option>Replied – No</option><option>No Reply (gave up)</option>
    </select>
    <select id="outPlatformFilter" onchange="renderOutreachTable()">
      <option value="">All Platforms</option><option>LinkedIn</option><option>Email</option><option>Other</option>
    </select>
  </div>
  <div class="table-wrap">
    <div class="table-header">
      <span class="table-title" id="outTableTitle">Outreach Contacts</span>
      <div class="pagination" id="outPagination"></div>
    </div>
    <div style="overflow-x:auto"><table><thead><tr>
      <th>Company</th><th>Contact Name</th><th>Their Role</th><th>Platform</th>
      <th>Sent</th><th>Reply</th><th>Follow-up</th><th>Notes</th><th>Actions</th>
    </tr></thead><tbody id="outBody"></tbody></table></div>
  </div>
</div>

<div class="tab-content" id="content-templates">
  <div class="tmpl-filter-bar">
    <button class="cat-filter-btn active" data-cat="" onclick="setTmplFilter(this,'')">All</button>
    <button class="cat-filter-btn" data-cat="Connect" onclick="setTmplFilter(this,'Connect')">🔗 LinkedIn Connect</button>
    <button class="cat-filter-btn" data-cat="Followup" onclick="setTmplFilter(this,'Followup')">🔄 Follow-up</button>
    <button class="cat-filter-btn" data-cat="ColdEmail" onclick="setTmplFilter(this,'ColdEmail')">📧 Cold Email</button>
    <button class="cat-filter-btn" data-cat="Referral" onclick="setTmplFilter(this,'Referral')">🤝 Referral Ask</button>
    <button class="cat-filter-btn" data-cat="ThankYou" onclick="setTmplFilter(this,'ThankYou')">🙏 Thank You</button>
  </div>
  <div class="tmpl-grid" id="tmplGrid"></div>
</div>

<div class="overlay" id="tmplModal">
  <div class="modal">
    <div class="modal-hdr"><h2 id="tmplModalTitle">Add Template</h2><button class="close-btn" onclick="closeModal('tmplModal')">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="tmplId">
      <div class="form-row">
        <div class="form-group"><label>Template Name *</label><input id="tfName" placeholder="e.g. Short LinkedIn Connect"></div>
        <div class="form-group"><label>Category *</label>

<div class="overlay" id="outModal">

</div>
